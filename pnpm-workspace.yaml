# pnpm 11 reads install policy from this file (not package.json / .npmrc).
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

# Install oxc-parser native bindings for local dev and Linux deploy targets.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - current
    - glibc

# Iconify JSON packs publish often; skip the 24h minimumReleaseAge check so
# Coolify installs are not blocked by ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION.
minimumReleaseAgeExclude:
  - '@iconify-json/*'
  - '@types/node@26.4.1'
  - baseline-browser-mapping@2.11.24 || 2.11.25
  - prettier@3.9.7 || 3.9.8
